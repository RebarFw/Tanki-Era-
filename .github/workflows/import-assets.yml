name: Import client assets

on:
  push:
    paths:
      - .github/workflows/import-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 5 --retry-delay 2 -X POST "https://temp.sh/WGLAn/Prelauncher.swf" -o assets/Prelauncher.swf
          curl -L --fail --retry 5 --retry-delay 2 -X POST "https://temp.sh/jwCmu/Loader.swf" -o assets/Loader.swf
          curl -L --fail --retry 5 --retry-delay 2 -X POST "https://temp.sh/DJigu/library.swf" -o assets/library.swf
          curl -L --fail --retry 5 --retry-delay 2 -X POST "https://temp.sh/NWKQA/socket.cfg" -o assets/socket.cfg

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          cat > assets.sha256 <<'EOF'
          fec3868d4c56b0d825b5bbcfae32b129a60ac05de5461ae9d87a124af3d37629  assets/Prelauncher.swf
          24f39b8cbbca092b28f10c88815a17a98608505b3595887c9a14173963bd8587  assets/Loader.swf
          b59b94607bdb2f26b2cb4cb7ace674ce6157b06864e490a6835f26bd3f293acb  assets/library.swf
          24556a62230c1207b2f783b1625bdabe428a5d1db71e5a57775135e29a803b30  assets/socket.cfg
          EOF
          sha256sum -c assets.sha256
          rm assets.sha256

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Prelauncher.swf assets/Loader.swf assets/library.swf assets/socket.cfg
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Add remote client assets"
          git push
