name: Import client zip

on:
  push:
    paths:
      - .github/workflows/import-client-zip.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-client-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download client zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -L --fail --retry 5 --retry-delay 2 -X POST "https://temp.sh/qgzUk/Tanki_Era_GitHub_Client.zip" -o "downloads/Tanki-Era-GitHub-Client.zip"

      - name: Verify client zip
        shell: bash
        run: |
          set -euo pipefail
          echo "f62ec89e098745c969f9ccdf33eb5a0dbc4d439ceb5b136b9f431aae05d19165  downloads/Tanki-Era-GitHub-Client.zip" | sha256sum -c -

      - name: Commit client zip
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/Tanki-Era-GitHub-Client.zip"
          if git diff --cached --quiet; then
            echo "No client zip changes to commit."
            exit 0
          fi
          git commit -m "Add GitHub bootstrap client download"
          git push
